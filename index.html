<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unspoken — اسألني أي شيء.</title>
<meta name="description" content="مساحة هادئة لإرسال أسئلتك بشكل مجهول التام.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23100d26'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237ec8ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<canvas id="dust" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>

<main class="shell">

  <header class="hero">
    <h1 class="brand">unspoken</h1>
    <p class="tagline">اسألني أي شيء.</p>

    <div class="portrait">
      <span class="portrait__ring" aria-hidden="true"></span>
      <img src="/assets/joe-soul.png" alt="جو غاردنر في هيئة الروح الزرقاء" width="160" height="160" loading="eager">
    </div>
  </header>

  <section class="ask" aria-labelledby="ask-title">
    <h2 id="ask-title" class="sr-only">أرسل سؤالك</h2>
    <form id="ask-form" novalidate>
      <label class="sr-only" for="question">سؤالك</label>
      <textarea id="question" name="question" rows="4" maxlength="1000"
                placeholder="اكتب سؤالك هنا..." required></textarea>

      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="send-btn">إرسال السؤال</button>
      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="answers" aria-labelledby="answers-title">
    <h2 id="answers-title" class="section-title">أسئلة وأجوبة</h2>
    <div id="cards" class="cards">
      <p class="empty" id="empty">لا توجد أجوبة منشورة بعد… كن أول من يسأل.</p>
    </div>
  </section>

  <footer class="foot">
    <span>unspoken</span>
    <span class="dot" aria-hidden="true">·</span>
    <span>مجهول تماماً</span>
  </footer>

</main>

<script src="/dust.js"></script>
<script src="/app.js"></script>
</body>
</html>
