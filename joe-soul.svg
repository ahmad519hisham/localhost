<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A glowing soul floating in deep space">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1b1638"/>
      <stop offset="55%" stop-color="#100d26"/>
      <stop offset="100%" stop-color="#07061a"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#6aa8ff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#eaffff"/>
      <stop offset="38%" stop-color="#a8e8ff"/>
      <stop offset="72%" stop-color="#6bb6ff"/>
      <stop offset="100%" stop-color="#5f7dff"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a9d8ff" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="400" height="400" fill="url(#space)"/>

    <g fill="#cfe8ff">
      <circle cx="70" cy="80" r="1.6" opacity=".8"/>
      <circle cx="330" cy="70" r="1.2" opacity=".6"/>
      <circle cx="300" cy="300" r="1.5" opacity=".7"/>
      <circle cx="90" cy="300" r="1.1" opacity=".5"/>
      <circle cx="200" cy="46" r="1.3" opacity=".65"/>
      <circle cx="46" cy="190" r="1.2" opacity=".55"/>
      <circle cx="356" cy="196" r="1.4" opacity=".6"/>
      <circle cx="140" cy="350" r="1" opacity=".45"/>
      <circle cx="255" cy="130" r="1" opacity=".5"/>
      <circle cx="150" cy="120" r="0.9" opacity=".45"/>
    </g>

    <ellipse cx="200" cy="215" rx="150" ry="150" fill="url(#aura)" filter="url(#softer)" opacity=".75"/>

    <!-- soul figure -->
    <g filter="url(#soft)" opacity=".55">
      <path d="M200 92c-38 0-64 30-64 70 0 30 12 50 22 74 9 22 12 46 12 70 0 18 14 32 30 32s30-14 30-32c0-24 3-48 12-70 10-24 22-44 22-74 0-40-26-70-64-70z"
            fill="#6bb6ff"/>
    </g>

    <g filter="url(#glow)">
      <path d="M200 96c-35 0-60 28-60 66 0 28 11 47 21 70 9 21 11 44 11 67 0 17 13 30 28 30s28-13 28-30c0-23 2-46 11-67 10-23 21-42 21-70 0-38-25-66-60-66z"
            fill="url(#body)"/>
      <path d="M200 96c-35 0-60 28-60 66 0 28 11 47 21 70 9 21 11 44 11 67 0 17 13 30 28 30"
            fill="none" stroke="url(#rim)" stroke-width="3" stroke-linecap="round" opacity=".75"/>
      <ellipse cx="200" cy="152" rx="30" ry="34" fill="#ffffff" opacity=".28" filter="url(#soft)"/>
      <path d="M176 152c6-9 16-14 24-14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7" fill="none"/>
    </g>

    <g fill="#bfeaff" opacity=".6">
      <circle cx="168" cy="330" r="2.4"/>
      <circle cx="236" cy="316" r="2"/>
      <circle cx="200" cy="352" r="1.6"/>
    </g>

    <circle cx="200" cy="200" r="199" fill="none" stroke="#7f6cff" stroke-opacity=".35" stroke-width="2"/>
  </g>
</svg>
